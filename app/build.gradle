plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "com.m3rd.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.mangodrive.unlim"
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName "7.0-Native-TDLib"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            minifyEnabled false
            applicationIdSuffix ""
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            java {
                srcDirs = ['src/main/java']
                exclude 'com/arabunlim/**'
            }
            res.srcDirs = ['src/main/res']
            assets.srcDirs = ['src/main/assets']
        }
    }

    packagingOptions {
        pickFirst 'lib/arm64-v8a/libtdjni.so'
        pickFirst 'lib/armeabi-v7a/libtdjni.so'
        pickFirst 'lib/x86_64/libtdjni.so'
        pickFirst 'lib/x86/libtdjni.so'
    }
}

preBuild.doFirst {
    delete fileTree("src/main/java/com/arabunlim")
    delete file("build.gradle.kts")
    delete file("../build.gradle.kts")
    delete file("../settings.gradle.kts")
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    // مكتبة TDLib الأصلية المترجمة للأندرويد (Native C++ libtdjni.so + Client + TdApi)
    implementation 'com.github.tdlibx:td:1.8.56'
}
