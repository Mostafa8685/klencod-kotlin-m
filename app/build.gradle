plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def activeKotlinFiles = [
    'MainActivity.kt',
    'CloudBuildActivity.kt',
    'AiAssistantActivity.kt',
    'TemplatesActivity.kt',
    'SettingsActivity.kt',
    'ProjectManager.kt',
    'ProjectTemplates.kt',
    'FileTreeAdapter.kt',
    'GitHubCloudClient.kt',
    'AiClient.kt',
    'AppPrefs.kt'
] as Set

tasks.register('cleanLegacyFiles') {
    doLast {
        def srcDir = file('src/main/java/com/apk3rade/mangoide')
        if (srcDir.exists()) {
            srcDir.listFiles()?.each { f ->
                if (f.isFile() && f.name.endsWith('.kt') && !activeKotlinFiles.contains(f.name)) {
                    f.delete()
                }
            }
        }
    }
}

preBuild.dependsOn('cleanLegacyFiles')

android {
    namespace 'com.apk3rade.mangoide'
    compileSdk 34

    defaultConfig {
        applicationId 'com.apk3rade.mangoide'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Pure Android SDK + Kotlin stdlib: zero third-party UI dependency conflicts
}
