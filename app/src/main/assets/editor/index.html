<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mango IDE Editor</title>
<link rel="stylesheet" href="editor.css">
</head>
<body>
<div id="app">
  <div id="editor-wrap">
    <div id="gutter" aria-hidden="true">1</div>
    <div id="code-layer">
      <pre id="highlight" aria-hidden="true"><code id="highlight-code"></code></pre>
      <textarea id="code-input" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" placeholder="// اختر ملفاً من القائمة الجانبية لبدء الكتابة..."></textarea>
    </div>
  </div>
  <div id="symbol-bar">
    <button type="button" data-ins="    ">TAB</button>
    <button type="button" data-ins="{">{</button>
    <button type="button" data-ins="}">}</button>
    <button type="button" data-ins="(">(</button>
    <button type="button" data-ins=")">)</button>
    <button type="button" data-ins="[">[</button>
    <button type="button" data-ins="]">]</button>
    <button type="button" data-ins="&lt;">&lt;</button>
    <button type="button" data-ins="&gt;">&gt;</button>
    <button type="button" data-ins="=">=</button>
    <button type="button" data-ins=";">;</button>
    <button type="button" data-ins="&quot;">"</button>
    <button type="button" data-ins="'">'</button>
    <button type="button" data-ins="/">/</button>
  </div>
</div>
<script src="editor.js"></script>
</body>
</html>
